version: 2
updates:
  # 1. تحديث حزم NPM (Next.js, Supabase, UI)
    - package-ecosystem: "npm"
        directory: "/"
            schedule:
                  interval: "weekly"
                        day: "monday"
                              time: "06:00"
                                    timezone: "Asia/Baghdad"
                                        open-pull-requests-limit: 5
                                            commit-message:
                                                  prefix: "chore(deps)"
                                                        include: "scope"
                                                            
                                                                # تجميع الحزم المترابطة في PRs موحدة
                                                                    groups:
                                                                          nextjs-core:
                                                                                  patterns:
                                                                                            - "next"
                                                                                                      - "react"
                                                                                                                - "react-dom"
                                                                                                                      supabase-ecosystem:
                                                                                                                              patterns:
                                                                                                                                        - "@supabase/*"
                                                                                                                                              ui-libraries:
                                                                                                                                                      patterns:
                                                                                                                                                                - "tailwind*"
                                                                                                                                                                          - "lucide-react"
                                                                                                                                                                                    - "@radix-ui/*"
                                                                                                                                                                                              - "framer-motion"

                                                                                                                                                                                                # 2. تحديث أدوات وخطوط إنتاج GitHub Actions
                                                                                                                                                                                                  - package-ecosystem: "github-actions"
                                                                                                                                                                                                      directory: "/"
                                                                                                                                                                                                          schedule:
                                                                                                                                                                                                                interval: "monthly"
                                                                                                                                                                                                                    open-pull-requests-limit: 3
                                                                                                                                                                                                                        commit-message:
                                                                                                                                                                                                                              prefix: "ci(actions)"
                                                                                                                                                                                                                              