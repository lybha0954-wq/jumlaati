<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- خلفية الشعار -->
  <rect x="8" y="18" width="64" height="64" rx="16" fill="#FB923C"/>
  
  <!-- تفاصيل الصندوق -->
  <path d="M 40 22 L 40 46" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 12 46 L 68 46" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
  
  <!-- نقطة التميز -->
  <circle cx="64" cy="26" r="7" fill="#1E293B"/>
  
  <!-- النص -->
  <text x="90" y="68" 
        font-family="Tajawal, system-ui, sans-serif" 
        font-size="48" 
        font-weight="800" 
        fill="#1E293B"
        letter-spacing="-1">
    جملتي
  </text>
  
  <!-- وصف صغير -->
  <text x="90" y="84" 
        font-family="Tajawal, system-ui, sans-serif" 
        font-size="11" 
        font-weight="500" 
        fill="#64748B"
        letter-spacing="0.5">
    للتجارة الإلكترونية
  </text>
</svg>
